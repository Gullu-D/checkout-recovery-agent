services:
  recovery-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - RAZORPAY_MODE=${RAZORPAY_MODE:-mock}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
